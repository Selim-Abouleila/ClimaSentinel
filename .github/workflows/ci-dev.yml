# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: PR → dev
#
# Triggered on every pull request targeting the 'dev' branch.
# Runs data-contract, unit and integration tests, then builds both Docker images.
# ─────────────────────────────────────────────────────────────────────────

name: CI — PR to Dev

on:
  pull_request:
    branches: [dev]

jobs:
  data-contracts:
    name: Validate Data Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: transform/requirements.txt

      - name: Validate city configuration contracts
        run: |
          python scripts/validate_city_configuration.py
          python -m unittest discover -s scripts/tests -v
          python -m unittest discover -s transform/scripts/tests -v

      - name: Install dbt dependencies
        run: python -m pip install -r transform/requirements.txt

      - name: Parse dbt project without warehouse credentials
        env:
          GCP_PROJECT_ID: test-project
          GCP_REGION: europe-west9
        run: >-
          dbt parse
          --project-dir transform
          --profiles-dir transform
          --target dev
          --no-partial-parse

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ingestion test dependency
        run: pip install python-dotenv==1.0.1

      - name: Run ingestion failure-contract tests
        working-directory: .
        env:
          GCP_PROJECT_ID: test-project
          PYTHONPATH: ingest
        run: pytest ingest/tests/ -v

      - name: Run unit tests
        run: pytest tests/ -v -m "not integration"

      - name: Run integration tests
        run: pytest tests/ -v -m integration

  frontend-checks:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [data-contracts, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -f backend/Dockerfile -t climasentinel-backend:test .

      - name: Build ingestion Docker image (no push)
        run: docker build -f ingest/Dockerfile -t climasentinel-ingest:test .
