# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: PR → dev
#
# Triggered on every pull request targeting the 'dev' branch.
# Runs unit tests, integration tests, and builds the Docker image.
# ─────────────────────────────────────────────────────────────────────────

name: CI — PR to Dev

on:
  pull_request:
    branches: [dev]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/ -k "not integration"

      - name: Run integration tests
        run: pytest tests/ -v -m integration

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -f backend/Dockerfile -t climasentinel-backend:test .
