# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: dev → staging
#
# Triggered when code is pushed to 'staging' (i.e., PR merged from dev).
# Runs the full test suite, then deploys to staging environment.
# ─────────────────────────────────────────────────────────────────────────

name: CI — Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t climasentinel-backend:staging .

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO: Add actual deployment steps (e.g., Railway, Render, etc.)
      - name: Deploy to staging (placeholder)
        run: echo "🚀 Deploy to staging environment — configure deployment target"

      # TODO: Deploy candidate model from MLflow registry
      - name: Deploy candidate model (placeholder)
        run: echo "🤖 Deploy candidate model from MLflow registry to staging"
