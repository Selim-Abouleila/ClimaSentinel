# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: dev → staging
#
# Triggered when code is pushed to 'staging' (i.e., PR merged from dev).
# Runs the full test suite, then deploys to staging environment.
# ─────────────────────────────────────────────────────────────────────────

name: CI — Deploy to Staging

on:
  push:
    branches: [staging]

concurrency:
  group: climasentinel-model-promotion
  cancel-in-progress: false

jobs:
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t climasentinel-backend:staging .

  train-model:
    name: Train and Register Heat/Rain Challenger
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/ci-mlops.yml
    secrets: inherit

  deploy-staging:
    name: Evaluate Challenger and Deploy Rule Baseline to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, train-model]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model promotion dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Evaluate Heat/Rain challenger and promote only if qualified
        run: python -m model.promote --allow-rejected
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN || secrets.DAGSHUB_TOKEN }}
          MLFLOW_MODEL_ALIAS: champion
          MLFLOW_MODEL_VERSION: ${{ needs.train-model.outputs.model_version }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Railway
        run: railway up --environment staging --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Deploy Frontend to Railway
        run: railway up --environment staging --service ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}

  e2e-test:
    name: E2E Playwright Test
    runs-on: ubuntu-latest
    needs: deploy-staging
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for the new staging frontend release
        env:
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent --show-error --location \
              "${STAGING_FRONTEND_URL%/}/forecast" \
              | grep --fixed-strings --quiet "Climate Risk Forecast"; then
              echo "Staging frontend release is ready."
              exit 0
            fi
            echo "Waiting for staging frontend release (${attempt}/36)..."
            sleep 10
          done
          echo "Staging frontend did not become ready within 6 minutes."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Test
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.STAGING_FRONTEND_URL }}
        run: npm run test:e2e
