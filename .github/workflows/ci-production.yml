# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: staging → main (Production)
#
# Triggered when code is pushed to 'main' (i.e., PR merged from staging).
# Requires passing model promotion gates before deploying to production.
# ─────────────────────────────────────────────────────────────────────────

name: CI — Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: climasentinel-model-promotion
  cancel-in-progress: false

jobs:
  train-model:
    name: Train and Register Heat/Rain Horizons
    permissions:
      contents: write
    uses: ./.github/workflows/ci-mlops.yml
    secrets: inherit

  promotion-gates:
    name: Heat/Rain Model Promotion Gates
    runs-on: ubuntu-latest
    needs: train-model

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Heat/Rain quality gates and promote model
        run: python model/promote.py
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          MLFLOW_MODEL_VERSION: ${{ needs.train-model.outputs.model_version }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: promotion-gates
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway (Disabled)
        run: echo "⚠️ Railway production deployment temporarily disabled"
