# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: staging → main (Production)
#
# Triggered when code is pushed to 'main' (i.e., PR merged from staging).
# Evaluates the ML challenger, while the operational rule baseline remains
# independently deployable when model-quality gates reject the candidate.
# ─────────────────────────────────────────────────────────────────────────

name: CI — Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: climasentinel-model-promotion
  cancel-in-progress: false

jobs:
  train-model:
    name: Train and Register Heat/Rain Challenger
    permissions:
      contents: write
    uses: ./.github/workflows/ci-mlops.yml
    secrets: inherit

  evaluate-challenger:
    name: Evaluate Heat/Rain Challenger
    runs-on: ubuntu-latest
    needs: train-model

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Evaluate challenger and promote only if qualified
        run: python -m model.promote --allow-rejected
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN || secrets.DAGSHUB_TOKEN }}
          MLFLOW_MODEL_ALIAS: champion
          MLFLOW_MODEL_VERSION: ${{ needs.train-model.outputs.model_version }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: evaluate-challenger
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway (Disabled)
        run: echo "⚠️ Railway production deployment temporarily disabled"
