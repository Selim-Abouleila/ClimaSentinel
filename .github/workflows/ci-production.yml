# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline: staging → main (Production)
#
# Triggered when code is pushed to 'main' (i.e., PR merged from staging).
# Requires passing model promotion gates before deploying to production.
# ─────────────────────────────────────────────────────────────────────────

name: CI — Deploy to Production

on:
  push:
    branches: [main]

jobs:
  promotion-gates:
    name: Model Promotion Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mlflow dagshub

      - name: Run quality gates and promote model
        run: python model/promote.py
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: promotion-gates
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway (Disabled)
        run: echo "⚠️ Railway production deployment temporarily disabled"
