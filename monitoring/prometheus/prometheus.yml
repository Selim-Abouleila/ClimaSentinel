global:
  scrape_interval: 15s  # Standard scrape interval for active monitoring/demo

scrape_configs:
  - job_name: 'climasentinel-backend'
    # By default, prometheus will look at the /metrics path
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      # Replace this with the actual Railway backend production URL when deploying
      - targets: ['climasentinel-production.up.railway.app']
